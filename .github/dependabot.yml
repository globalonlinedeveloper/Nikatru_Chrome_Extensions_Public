version: 2

# GitHub Actions only, deliberately.
#
# The extensions in this repository have zero runtime dependencies and are meant
# to keep having zero: nothing from npm ends up inside a shipped package, so
# there is no runtime dependency graph for a bot to watch. The npm packages that
# do exist are dev-only (Playwright under a tool's test/e2e, web-ext via npx)
# and they are pinned where it matters; a weekly PR churn on them would be noise
# against a suite that only runs on a label or a schedule anyway.
#
# Actions are different: they run with a token, on our repository, and a stale
# major is how a supply-chain problem arrives. CI uses first-party actions only
# (checkout, setup-node, upload-artifact), referenced by major tag — which is
# exactly what Dependabot can keep current.

updates:
  - package-ecosystem: "github-actions"
    directory: "/"                     # covers every file in .github/workflows/
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"                     # matches the repo's `<scope>: <summary>` convention
    labels:
      - "ci"
      - "dependencies"
